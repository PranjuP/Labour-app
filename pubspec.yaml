name: labour_connect
description: Labour Connect — a platform connecting companies with labourers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.17.5 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^1.19.1
  firebase_auth: ^3.4.1
  cloud_firestore: ^3.3.0
  shared_preferences: ^2.0.11
  provider: ^6.0.3
  url_launcher: ^6.1.5
  animated_splash_screen: ^1.3.0
  font_awesome_flutter: ^10.1.0
  intl: ^0.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
